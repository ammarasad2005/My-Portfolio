<?xml version="1.0" encoding="UTF-8"?>
<!-- Developer Workbench Sketch — inline SVG replacement for desk_sketch_illustration.png.
     Original PNG was byte-corrupted in the git repo (UTF-8 replacement chars throughout).
     This SVG captures the same "developer desk sketch" aesthetic at a few hundred bytes.
     Drawn on a warm cream background with pencil-stroke lines to match the paper theme. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" fill="none" stroke="#3A3630" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Background paper tone -->
  <rect x="0" y="0" width="400" height="360" fill="#EFEADF" stroke="none"/>

  <!-- Laptop (center) -->
  <g>
    <!-- Screen -->
    <rect x="120" y="80" width="160" height="100" rx="4" fill="#F5F2EE" stroke="#3A3630" stroke-width="1.6"/>
    <!-- Code lines on screen -->
    <line x1="135" y1="100" x2="200" y2="100" stroke="#8a8580" stroke-width="1"/>
    <line x1="135" y1="112" x2="220" y2="112" stroke="#8a8580" stroke-width="1"/>
    <line x1="135" y1="124" x2="180" y2="124" stroke="#8a8580" stroke-width="1"/>
    <line x1="135" y1="136" x2="210" y2="136" stroke="#8a8580" stroke-width="1"/>
    <line x1="135" y1="148" x2="190" y2="148" stroke="#8a8580" stroke-width="1"/>
    <line x1="135" y1="160" x2="225" y2="160" stroke="#8a8580" stroke-width="1"/>
    <!-- Base -->
    <path d="M 100 180 L 300 180 L 290 200 L 110 200 Z" fill="#E5DFD3" stroke="#3A3630" stroke-width="1.6"/>
    <line x1="180" y1="190" x2="220" y2="190" stroke="#8a8580" stroke-width="1"/>
  </g>

  <!-- Coffee cup (left) -->
  <g>
    <path d="M 50 220 L 50 270 Q 50 285 65 285 L 85 285 Q 100 285 100 270 L 100 220 Z" fill="#F5F2EE" stroke="#3A3630" stroke-width="1.6"/>
    <path d="M 100 230 Q 115 230 115 245 Q 115 260 100 260" fill="none" stroke="#3A3630" stroke-width="1.6"/>
    <!-- Steam -->
    <path d="M 65 210 Q 70 200 65 195" stroke="#8a8580" stroke-width="1.2" fill="none"/>
    <path d="M 80 210 Q 85 200 80 195" stroke="#8a8580" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Stack of books (right) -->
  <g>
    <rect x="300" y="240" width="70" height="14" fill="#D6702C" stroke="#3A3630" stroke-width="1.4" opacity="0.7"/>
    <rect x="305" y="226" width="65" height="14" fill="#8a8580" stroke="#3A3630" stroke-width="1.4" opacity="0.7"/>
    <rect x="298" y="212" width="72" height="14" fill="#1F2D3A" stroke="#3A3630" stroke-width="1.4" opacity="0.7"/>
  </g>

  <!-- Plant (left of laptop) -->
  <g>
    <!-- Pot -->
    <path d="M 70 280 L 90 280 L 88 305 L 72 305 Z" fill="#C04A38" stroke="#3A3630" stroke-width="1.4" opacity="0.6"/>
    <!-- Leaves -->
    <path d="M 80 280 Q 65 260 60 245" stroke="#3A3630" stroke-width="1.4" fill="none"/>
    <path d="M 80 280 Q 95 265 100 250" stroke="#3A3630" stroke-width="1.4" fill="none"/>
    <path d="M 80 280 Q 80 260 78 240" stroke="#3A3630" stroke-width="1.4" fill="none"/>
    <ellipse cx="60" cy="245" rx="6" ry="10" fill="#3d7a4e" opacity="0.5" stroke="#3A3630" stroke-width="1"/>
    <ellipse cx="100" cy="250" rx="6" ry="10" fill="#3d7a4e" opacity="0.5" stroke="#3A3630" stroke-width="1"/>
    <ellipse cx="78" cy="240" rx="6" ry="10" fill="#3d7a4e" opacity="0.5" stroke="#3A3630" stroke-width="1"/>
  </g>

  <!-- Sticky note (top right) -->
  <g transform="rotate(8 330 70)">
    <rect x="295" y="45" width="70" height="50" fill="#EAE1BD" stroke="#3A3630" stroke-width="1"/>
    <line x1="305" y1="60" x2="350" y2="60" stroke="#8a8580" stroke-width="0.8"/>
    <line x1="305" y1="72" x2="345" y2="72" stroke="#8a8580" stroke-width="0.8"/>
    <line x1="305" y1="84" x2="340" y2="84" stroke="#8a8580" stroke-width="0.8"/>
  </g>

  <!-- Hand-drawn dotted curve around the scene (annotation) -->
  <path d="M 30 30 Q 200 10 370 30" stroke="#3A3630" stroke-width="1" stroke-dasharray="2 3" fill="none"/>

  <!-- "DESK" label -->
  <text x="200" y="335" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#3A3630" text-anchor="middle" letter-spacing="3" stroke="none">— DESK —</text>
</svg>
